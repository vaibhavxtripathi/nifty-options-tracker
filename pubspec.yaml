name: nifty_options_tracker
description: Live Nifty options tracker — read-only market data over Angel One SmartAPI.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase governs who may open the app. It never touches the broker session.
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # A writable directory for the contract cache. Nothing in dart:io can locate
  # the app's documents directory on Android without a platform channel, and
  # "second launch uses cache with no network call" needs somewhere durable.
  path_provider: ^2.1.5

  # HMAC-SHA1 for local RFC-6238 TOTP generation (Phase 3), and required now by
  # the Phase 0 verification scripts under tool/.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drives timers in tests. The ping cadence and the backoff sequence are
  # behaviours about time; asserting them with real waits would add minutes to
  # every run. Dev-only: it never ships in the APK.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
